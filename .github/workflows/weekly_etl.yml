# Раз в неделю обновляет данные ЦБ и пересобирает дашборд в репозитории.
# Так на GitHub всегда лежит свежая версия отчёта, даже если никто не запускал проект локально.
name: Weekly ETL

on:
  schedule:
    - cron: "0 6 * * 1"  # каждый понедельник, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[report]"
      - name: Пайплайн + дашборд
        run: python -m cbr_analytics all
      - name: Коммит обновлённого отчёта
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: обновить дашборд по данным ЦБ"
          git push
