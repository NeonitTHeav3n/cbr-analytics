# Опциональный BI-контур: Postgres как хранилище + Metabase как BI.
# Базовый режим (DuckDB) работает без Docker вовсе — см. README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cbr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbr}
      POSTGRES_DB: cbr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbr"]
      interval: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_ADMIN_EMAIL: admin@example.com

volumes:
  pgdata:
